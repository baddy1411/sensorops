[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensorops"
version = "0.1.0"
description = "Industrial AI Platform for predictive maintenance and anomaly detection"
requires-python = ">=3.11"

dependencies = [
    # Orchestration
    "dagster>=1.7",
    "dagster-webserver>=1.7",
    # ML
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "reservoirpy>=0.3",
    # MLflow
    "mlflow>=2.13",
    # Serving
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    # LLM (DeepSeek via OpenAI-compatible SDK)
    "openai>=1.30",
    # Streaming sim
    "aiokafka>=0.10",
    # Vector store
    "chromadb>=0.5",
    # Lineage
    "openlineage-python>=1.18",
    # Utilities
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13",
    "pyarrow>=16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Tell Dagster where the Definitions object lives
[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "models*", "pipelines*", "serving*", "llm*", "lineage*"]

[tool.dagster]
module_name = "pipelines"
